<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buse Bonus Hesaplama</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(2, 8, 22, 0.88), rgba(2, 8, 22, 0.92)),
        url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=2070&auto=format&fit=crop') center center / cover no-repeat fixed;
      color: #ffffff;
      padding: 44px 22px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "BUSE BONUS";
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(70px, 11vw, 190px);
      font-weight: 900;
      letter-spacing: 6px;
      color: rgba(255, 212, 71, 0.06);
      text-shadow: 0 0 30px rgba(255, 212, 71, 0.08);
      transform: rotate(-10deg);
      pointer-events: none;
      z-index: 0;
      white-space: nowrap;
    }

    .page {
      width: 100%;
      max-width: 1250px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero {
      text-align: center;
      margin-bottom: 34px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffd447;
      font-weight: 900;
      letter-spacing: 0.6px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.22);
    }

    .hero h1 {
      margin-top: 16px;
      font-size: clamp(28px, 4vw, 52px);
      line-height: 1.05;
      color: #ffffff;
      text-shadow: 0 4px 25px rgba(0, 0, 0, 0.45);
    }

    .hero h1 span {
      color: #ffd447;
    }

    .hero p {
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background:
        linear-gradient(180deg, rgba(7, 29, 77, 0.92), rgba(3, 13, 36, 0.94));
      border: 1px solid rgba(255, 212, 71, 0.14);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(12px);
    }

    .card h2 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 22px;
      color: #ffd447;
      text-shadow: 0 2px 18px rgba(255, 212, 71, 0.22);
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.11);
      color: #ffffff;
      padding: 0 15px;
      font-size: 17px;
      outline: none;
      margin-bottom: 14px;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.48);
    }

    input:focus {
      border-color: rgba(255, 212, 71, 0.72);
      box-shadow: 0 0 0 3px rgba(255, 212, 71, 0.12);
    }

    .result-line {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 9px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-weight: 800;
      font-size: 18px;
    }

    .result-line strong {
      color: #ffd447;
      margin-right: 6px;
    }

    .display {
      height: 64px;
      background: #020a1f;
      border-radius: 16px;
      margin-bottom: 16px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 28px;
      font-weight: 800;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .calc-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 56px;
      border: none;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.15s ease;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.22);
    }

    button:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.18);
    }

    button:active {
      transform: scale(0.96);
    }

    .gold {
      background: #ffd447;
      color: #06143b;
    }

    .red {
      background: #c73535;
    }

    .equal {
      background: #1ab864;
    }

    .wide {
      grid-column: span 2;
    }

    @media (max-width: 1050px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        max-width: 520px;
        width: 100%;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="brand">Buse Bonus</div>
      <h1>Bonus ve İşlem <span>Hesaplama Paneli</span></h1>
      <p>Yüzde, yatırım/çekim farkı ve standart hesap makinesi tek ekranda.</p>
    </section>

    <section class="grid">
      <div class="card">
        <h2>Yüzde Hesaplayıcı</h2>
        <input type="number" id="percentInput" placeholder="Sayı girin" oninput="calculatePercentages()" />
        <div class="result-line"><strong>%5:</strong><span id="p5">0.00</span></div>
        <div class="result-line"><strong>%10:</strong><span id="p10">0.00</span></div>
        <div class="result-line"><strong>%15:</strong><span id="p15">0.00</span></div>
        <div class="result-line"><strong>%20:</strong><span id="p20">0.00</span></div>
        <div class="result-line"><strong>%25:</strong><span id="p25">0.00</span></div>
        <div class="result-line"><strong>%30:</strong><span id="p30">0.00</span></div>
        <div class="result-line"><strong>%40:</strong><span id="p40">0.00</span></div>
        <div class="result-line"><strong>%50:</strong><span id="p50">0.00</span></div>
        <div class="result-line"><strong>%100:</strong><span id="p100">0.00</span></div>
        <div class="result-line"><strong>%200:</strong><span id="p200">0.00</span></div>
      </div>

      <div class="card">
        <h2>Yatırım / Çekim</h2>
        <input type="number" id="deposit" placeholder="Yatırım miktarı" oninput="calculateDepositWithdraw()" />
        <input type="number" id="withdraw" placeholder="Çekim miktarı" oninput="calculateDepositWithdraw()" />
        <div class="result-line"><strong>Fark:</strong><span id="diff">0.00</span></div>
        <div class="result-line"><strong>%5:</strong><span id="diff5">0.00</span></div>
        <div class="result-line"><strong>%10:</strong><span id="diff10">0.00</span></div>
        <div class="result-line"><strong>%20:</strong><span id="diff20">0.00</span></div>
      </div>

      <div class="card">
        <h2>Hesap Makinesi</h2>
        <div class="display" id="display">0</div>
        <div class="calc-buttons">
          <button class="red" onclick="clearCalc()">C</button>
          <button onclick="appendCalc('/')">÷</button>
          <button onclick="appendCalc('*')">×</button>
          <button onclick="deleteCalc()">⌫</button>

          <button onclick="appendCalc('7')">7</button>
          <button onclick="appendCalc('8')">8</button>
          <button onclick="appendCalc('9')">9</button>
          <button class="gold" onclick="appendCalc('-')">−</button>

          <button onclick="appendCalc('4')">4</button>
          <button onclick="appendCalc('5')">5</button>
          <button onclick="appendCalc('6')">6</button>
          <button class="gold" onclick="appendCalc('+')">+</button>

          <button onclick="appendCalc('1')">1</button>
          <button onclick="appendCalc('2')">2</button>
          <button onclick="appendCalc('3')">3</button>
          <button class="equal" onclick="calculateCalc()">=</button>

          <button class="wide" onclick="appendCalc('0')">0</button>
          <button onclick="appendCalc('.')">.</button>
          <button onclick="appendCalc('%')">%</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const percentages = [5, 10, 15, 20, 25, 30, 40, 50, 100, 200];

    function money(value) {
      return Number(value || 0).toLocaleString('tr-TR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function calculatePercentages() {
      const value = parseFloat(document.getElementById('percentInput').value) || 0;
      percentages.forEach(percent => {
        document.getElementById('p' + percent).textContent = money(value * percent / 100);
      });
    }

    function calculateDepositWithdraw() {
      const deposit = parseFloat(document.getElementById('deposit').value) || 0;
      const withdraw = parseFloat(document.getElementById('withdraw').value) || 0;
      const diff = deposit - withdraw;

      document.getElementById('diff').textContent = money(diff);
      document.getElementById('diff5').textContent = money(diff * 0.05);
      document.getElementById('diff10').textContent = money(diff * 0.10);
      document.getElementById('diff20').textContent = money(diff * 0.20);
    }

    let calcValue = '';
    const display = document.getElementById('display');

    function appendCalc(value) {
      const operators = ['+', '-', '*', '/', '%'];
      const last = calcValue.slice(-1);

      if (operators.includes(value) && operators.includes(last)) {
        calcValue = calcValue.slice(0, -1) + value;
      } else {
        calcValue += value;
      }

      display.textContent = calcValue.replace(/\*/g, '×').replace(/\//g, '÷') || '0';
    }

    function clearCalc() {
      calcValue = '';
      display.textContent = '0';
    }

    function deleteCalc() {
      calcValue = calcValue.slice(0, -1);
      display.textContent = calcValue.replace(/\*/g, '×').replace(/\//g, '÷') || '0';
    }

    function calculateCalc() {
      try {
        if (!calcValue) return;
        const safe = calcValue.replace(/%/g, '/100');
        const result = Function('"use strict"; return (' + safe + ')')();
        if (!isFinite(result)) throw new Error('Hata');
        calcValue = String(parseFloat(result.toFixed(8)));
        display.textContent = calcValue;
      } catch (e) {
        display.textContent = 'Hata';
        calcValue = '';
      }
    }

    document.addEventListener('keydown', function(e) {
      const active = document.activeElement;

      if (
        active &&
        (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')
      ) {
        return;
      }

      if (!isNaN(e.key) || ['+', '-', '*', '/', '.', '%'].includes(e.key)) {
        appendCalc(e.key);
      }

      if (e.key === 'Enter') calculateCalc();
      if (e.key === 'Backspace') deleteCalc();
      if (e.key === 'Escape') clearCalc();
    });
  </script>
</body>
</html>
